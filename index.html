<!DOCTYPE html>
<html lang="zh-CN">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }

  .game-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 800px;
    color: #eee;
  }

  .title {
    font-size: 28px;
    font-weight: bold;
    color: #f0c040;
    text-shadow: 0 0 10px rgba(240,192,64,0.5);
    letter-spacing: 4px;
  }

  .stats {
    display: flex;
    gap: 30px;
    font-size: 16px;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-label {
    color: #aaa;
  }

  .stat-value {
    color: #f0c040;
    font-size: 20px;
    font-weight: bold;
  }

  .lives {
    display: flex;
    gap: 4px;
  }

  .life-icon {
    width: 16px;
    height: 16px;
    background: #4ecb71;
    border-radius: 2px;
    border: 1px solid #3a8;
  }

  .life-icon.lost {
    background: #555;
    border-color: #444;
  }

  canvas {
    border: 3px solid #444;
    background: #0a0a0a;
    box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 60px rgba(100,100,255,0.1);

  .controls-info {
    display: flex;
    gap: 40px;
    color: #888;
    font-size: 13px;
  }

  .key-hint {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .key {
    display: inline-block;
    background: #333;
    color: #ddd;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #555;
    font-size: 12px;
    min-width: 24px;
    text-align: center;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .overlay.active {
    pointer-events: all;
  }

  .message-box {
    background: rgba(0,0,0,0.85);
    border: 2px solid #f0c040;
    border-radius: 12px;
    padding: 30px 50px;
    text-align: center;
    color: #fff;
    display: none;
  }

  .message-box.show {
    display: block;
    animation: popIn 0.3s ease-out;

    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }

    font-size: 36px;
    margin-bottom: 10px;

    color: #aaa;
    margin-bottom: 20px;
    font-size: 16px;

    border: none;
    padding: 12px 40px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  keys[e.code] = true;
  if (e.code === 'Space' || e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  keys[e.code] = false;
});

const COLS = W / TILE;  // 20
const ROWS = H / TILE;  // 15

  speed:    { icon: '⚡', color: '#00bfff', label: '加速', duration: 480, weight: 20 },
  rapid:    { icon: '🔥', color: '#ff6600', label: '速射', duration: 600, weight: 20 },
  multishot:{ icon: '💥', color: '#ff44ff', label: '散射', duration: 480, weight: 15 },
  shield:   { icon: '🛡️', color: '#00ff88', label: '护盾', duration: -1,  weight: 15 },
  pierce:   { icon: '💠', color: '#ffe040', label: '穿透', duration: 600, weight: 15 },
  heal:     { icon: '💚', color: '#ff4444', label: '回血', duration: 0,   weight: 10 },
  bomb:     { icon: '💣', color: '#ff8800', label: '清屏', duration: 0,   weight: 5 },
};

// 根据权重随机选择一个buff类型
function randomPowerUpType() {
  const entries = Object.entries(POWERUP_DEFS);
  const totalWeight = entries.reduce((sum, [, def]) => sum + def.weight, 0);
  let r = Math.random() * totalWeight;
  for (const [key, def] of entries) {
    r -= def.weight;
    if (r <= 0) return key;
  }
  return entries[0][0];
}

// 激活一个buff
function activateBuff(type) {
  const def = POWERUP_DEFS[type];
  if (!def) return;

  // 即时效果
  if (def.duration === 0) {
    if (type === 'heal') {
      lives = Math.min(lives + 1, 5);
      updateUI();
      spawnParticles(player.x, player.y, '#ff4444', 25);
    } else if (type === 'bomb') {
      // 清屏：摧毁所有敌人
      for (const enemy of enemies) {
        if (enemy.alive) {
          enemy.alive = false;
          explosions.push(new Explosion(enemy.x, enemy.y, 'big'));
          spawnParticles(enemy.x, enemy.y, enemy.color, 20);
          score += 50;
        }
      }
      updateUI();
    }
    return;
  }

  // 护盾特殊处理：只能同时存在一个
  if (type === 'shield') {
    removeBuff('shield');
  }

  // 移除同类型buff（刷新时间）
  removeBuff(type);

  activeBuffs.push({ type, remaining: def.duration, maxDuration: def.duration });
}

function removeBuff(type) {
  activeBuffs = activeBuffs.filter(b => b.type !== type);
}

function hasBuff(type) {
  return activeBuffs.some(b => b.type === type);
}

function getBuffRemaining(type) {
  const b = activeBuffs.find(b => b.type === type);
  return b ? b.remaining : 0;
}

function getActiveBuffDefs() {
  return activeBuffs.map(b => ({ ...b, def: POWERUP_DEFS[b.type] }));
}

// 敌人种类定义
const ENEMY_TYPES = [
  { color: '#e04040', speed: 1.0,  label: '普通',   score: 100 },
  { color: '#ff6600', speed: 1.3,  label: '快速',   score: 150 },
  { color: '#cc44cc', speed: 0.8,  label: '重型',   score: 200 },
  { color: '#ffcc00', speed: 1.1,  label: '精英',   score: 300 },
];

function getRandomEnemyType(level) {
  // 随关卡增加，出现更强的敌人
  const maxTier = Math.min(ENEMY_TYPES.length - 1, Math.floor((level - 1) / 2));
  const weights = [50, 25, 15, 10]; // 越高tier概率越低
  const totalWeight = weights.slice(0, maxTier + 1).reduce((a, b) => a + b, 0);
  let r = Math.random() * totalWeight;
  for (let i = 0; i <= maxTier; i++) {
    r -= weights[i];
    if (r <= 0) return ENEMY_TYPES[i];
  }
  return ENEMY_TYPES[0];
}

function getMapData() {
  const idx = Math.min(level - 1, levelMaps.length - 1);
  return [...levelMaps[idx]];  // 返回副本
}

function getWallAt(col, row, mapData) {
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
  return mapData[row * COLS + col];
}

function setWallAt(col, row, mapData, val) {
  if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
    mapData[row * COLS + col] = val;
  }
}

// Tank 类
class Tank {
  constructor(x, y, dir, color, speed, isPlayer) {
    this.x = x;
    this.y = y;
    this.dir = dir;        // 'up' 'down' 'left' 'right'
    this.color = color;
    this.speed = speed;
    this.size = 30;        // 坦克大小 (在tile中)
    this.isPlayer = isPlayer;
    this.shootCooldown = 0;
    this.shootDelay = isPlayer ? 15 : 40;
    this.alive = true;
    this.animFrame = 0;
    this.moveTimer = 0;
    this.aiChangeDir = 0;
  }

  getBounds() {
    return {
      left: this.x - this.size / 2,
      top: this.y - this.size / 2,
      right: this.x + this.size / 2,
      bottom: this.y + this.size / 2,
    };
  }

  collidesWith(otherBounds) {
    const b = this.getBounds();
    return !(b.right <= otherBounds.left || b.left >= otherBounds.right ||
             b.bottom <= otherBounds.top || b.top >= otherBounds.bottom);
  }

  collidesWalls(mapData) {
    const b = this.getBounds();
    // 检查四个角
    const corners = [
      { col: Math.floor(b.left / TILE), row: Math.floor(b.top / TILE) },
      { col: Math.floor((b.right - 1) / TILE), row: Math.floor(b.top / TILE) },
      { col: Math.floor(b.left / TILE), row: Math.floor((b.bottom - 1) / TILE) },
      { col: Math.floor((b.right - 1) / TILE), row: Math.floor((b.bottom - 1) / TILE) },
    ];
    for (const c of corners) {
      const t = getWallAt(c.col, c.row, mapData);
      if (t === 1 || t === 2) return true; // 砖墙或钢铁
    }
    return false;
  }

  collidesTank(other) {
    if (!other.alive || other === this) return false;
    return this.collidesWith(other.getBounds());
  }

  move(dx, dy, dir, mapData, allEnemies) {
    this.dir = dir;
    const origX = this.x, origY = this.y;

    this.x += dx * this.speed;
    this.y += dy * this.speed;

    // 边界
    const b = this.getBounds();
    if (b.left < 0) this.x = this.size / 2;
    if (b.right > W) this.x = W - this.size / 2;
    if (b.top < 0) this.y = this.size / 2;
    if (b.bottom > H) this.y = H - this.size / 2;

    // 墙壁碰撞
    if (this.collidesWalls(mapData)) {
      this.x = origX;
      this.y = origY;
      return false;
    }

    // 与其他坦克碰撞
    const others = this.isPlayer ? allEnemies : [player, ...allEnemies];
    for (const t of others) {
      if (t && t !== this && t.alive && this.collidesTank(t)) {
        this.x = origX;
        this.y = origY;
        return false;
      }
    }

    return true;
  }

  shoot() {
    if (this.shootCooldown > 0) return null;
    this.shootCooldown = this.shootDelay;
    const bx = this.x + (this.dir === 'right' ? this.size / 2 : this.dir === 'left' ? -this.size / 2 : 0);
    const by = this.y + (this.dir === 'down' ? this.size / 2 : this.dir === 'up' ? -this.size / 2 : 0);
    return new Bullet(bx, by, this.dir, this.isPlayer);
  }

  update() {
    if (this.shootCooldown > 0) this.shootCooldown--;
    this.animFrame = (this.animFrame + 1) % 60;
  }
}

// Bullet 类
class Bullet {
  constructor(x, y, dir, isPlayerBullet) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.speed = 7;
    this.size = 4;
    this.isPlayerBullet = isPlayerBullet;
    this.alive = true;
  }

  getBounds() {
    return {
      left: this.x - this.size,
      top: this.y - this.size,
      right: this.x + this.size,
      bottom: this.y + this.size,
    };
  }

  update(mapData) {
    switch (this.dir) {
      case 'up': this.y -= this.speed; break;
      case 'down': this.y += this.speed; break;
      case 'left': this.x -= this.speed; break;
      case 'right': this.x += this.speed; break;
    }

    // 出界
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) {
      this.alive = false;
      return;
    }

    // 碰到墙壁
    const col = Math.floor(this.x / TILE);
    const row = Math.floor(this.y / TILE);
    const tile = getWallAt(col, row, mapData);
    if (tile === 1) {
      // 砖墙被摧毁
      setWallAt(col, row, mapData, 0);
      explosions.push(new Explosion(col * TILE + TILE / 2, row * TILE + TILE / 2, 'small'));
      // 穿透子弹不会被砖墙阻挡
      if (!this.isPierce) {
        this.alive = false;
      }
    } else if (tile === 2) {
      // 钢铁挡住子弹（穿透也无法通过）
      this.alive = false;
      explosions.push(new Explosion(this.x, this.y, 'tiny'));
    }
  }
}

// 爆炸效果
class Explosion {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type; // 'tiny' | 'small' | 'big'
    this.life = type === 'big' ? 18 : type === 'small' ? 12 : 6;
    this.maxLife = this.life;
  }

  get alive() { return this.life > 0; }

  update() { this.life--; }
}

// 粒子效果
class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 15 + Math.random() * 20;
    this.maxLife = this.life;
    this.size = 2 + Math.random() * 3;
  }

  get alive() { return this.life > 0; }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }
}

// PowerUp 道具类
class PowerUp {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.def = POWERUP_DEFS[type];
    this.radius = 13;
    this.life = 360;
    this.bobPhase = Math.random() * Math.PI * 2;
    this.collected = false;
    this.fadeOut = 60;
  }

  get alive() { return this.life > 0 && !this.collected; }

  update() {
    this.life--;
    this.bobPhase += 0.05;
  }

  draw(ctx) {
    if (!this.alive) return;

    const bob = Math.sin(this.bobPhase) * 4;
    const y = this.y + bob;
    const alpha = this.life < this.fadeOut
      ? (this.life / this.fadeOut) * (0.5 + 0.5 * Math.sin(this.life * 0.3))
      : 1;

    ctx.save();
    ctx.globalAlpha = alpha;

    const glowGrad = ctx.createRadialGradient(this.x, y, this.radius * 0.3, this.x, y, this.radius * 1.5);
    glowGrad.addColorStop(0, this.def.color);
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(this.x, y, this.radius * 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.strokeStyle = this.def.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(this.x, y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.def.icon, this.x, y);

    ctx.restore();
  }
}

// 浮动文字类（连杀、得分提示）
class FloatingText {
  constructor(x, y, text, color, size) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.size = size || 16;
    this.life = 40;
    this.maxLife = this.life;
  }

  get alive() { return this.life > 0; }

  update() {
    this.y -= 1.2;
    this.life--;
  }

  draw(ctx) {
    const alpha = this.life / this.maxLife;
    const scale = 1 + (1 - alpha) * 0.3;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.font = `bold ${this.size * scale}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

let particles = [];

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// ==================== 初始化 ====================
let mapData = [];

function buildWallList() {
  walls = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const t = getWallAt(col, row, mapData);
      if (t > 0) {
        walls.push({ col, row, type: t });
      }
    }
  }
}

function findSpawnPoints() {
  // 玩家出生点：底部中间
  const px = W / 2;
  const py = H - TILE;

  // 敌方出生点：顶部三个位置
  const ex = [TILE * 2, W / 2, W - TILE * 2];
  const ey = TILE;

  return { px, py, ex, ey };
}

function initLevel() {
  mapData = getMapData();
  buildWallList();

  const sp = findSpawnPoints();
  player = new Tank(sp.px, sp.py, 'up', '#4ecb71', 2.2, true);

  enemies = [];
  const enemyCount = Math.min(3 + level, 8);
  for (let i = 0; i < enemyCount; i++) {
    const ex = sp.ex[i % 3] + (Math.floor(i / 3) * TILE * 2);
    const ey = sp.ey + Math.floor(i / 3) * TILE * 2;
    const etype = getRandomEnemyType(level);
    const enemy = new Tank(ex, ey, 'down', etype.color, etype.speed + level * 0.1, false);
    enemy.scoreValue = etype.score;
    enemies.push(enemy);
  }

  bullets = [];
  explosions = [];
  particles = [];
  powerUps = [];
  activeBuffs = [];
  comboCount = 0;
  comboChainTime = 0;
  floatingTexts = [];
}

// ==================== 输入处理 ====================
function handleInput() {
  if (!player || !player.alive) return;

  let dx = 0, dy = 0, dir = player.dir;

  const up = keys['arrowup'] || keys['w'];
  const down = keys['arrowdown'] || keys['s'];
  const left = keys['arrowleft'] || keys['a'];
  const right = keys['arrowright'] || keys['d'];

  if (up && !down) { dy = -1; dir = 'up'; }
  else if (down && !up) { dy = 1; dir = 'down'; }
  else if (left && !right) { dx = -1; dir = 'left'; }
  else if (right && !left) { dx = 1; dir = 'right'; }

  if (dx !== 0 || dy !== 0) {
    // 加速buff：移动速度翻倍
    const speedMul = hasBuff('speed') ? 2.0 : 1.0;
    const origSpeed = player.speed;
    player.speed *= speedMul;
    player.move(dx, dy, dir, mapData, enemies);
    player.speed = origSpeed;
  }

  // 射击
  const shootKey = keys[' '] || keys['space'] || keys['j'] || keys['keyj'];
  if (shootKey) {
    const cooldownMult = hasBuff('rapid') ? 0.35 : 1.0;
    if (player.shootCooldown <= 0) {
      // 散射buff：射出3发子弹
      if (hasBuff('multishot')) {
        const spreadDirs = getSpreadDirs(player.dir);
        for (const sDir of spreadDirs) {
          const origDir = player.dir;
          player.dir = sDir;
          const b = player.shoot();
          if (b) {
            b.isPierce = hasBuff('pierce');
            bullets.push(b);
          }
          player.dir = origDir;
        }
        player.shootCooldown = Math.floor(player.shootDelay * cooldownMult);
      } else {
        const bullet = player.shoot();
        if (bullet) {
          bullet.isPierce = hasBuff('pierce');
          bullets.push(bullet);
          // 应用速射冷却缩减
          player.shootCooldown = Math.floor(player.shootDelay * cooldownMult);
        }
      }
    }
  }
}

// 散射方向辅助函数
function getSpreadDirs(baseDir) {
  switch (baseDir) {
    case 'up': return ['left', 'up', 'right'];
    case 'down': return ['left', 'down', 'right'];
    case 'left': return ['down', 'left', 'up'];
    case 'right': return ['up', 'right', 'down'];
    default: return [baseDir];
  }
}

// ==================== AI ====================
function aiUpdate(enemy) {
  if (!enemy.alive) return;

  enemy.moveTimer++;
  enemy.aiChangeDir--;

  // 随机改变方向
  if (enemy.aiChangeDir <= 0) {
    const dirs = ['up', 'down', 'left', 'right'];
    enemy.dir = dirs[Math.floor(Math.random() * 4)];
    enemy.aiChangeDir = 40 + Math.floor(Math.random() * 80);
  }

  // 如果面朝玩家的方向，有一定概率射击
  const dx = player.x - enemy.x;
  const dy = player.y - enemy.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  // 偶尔瞄准玩家
  if (Math.random() < 0.02) {
    if (Math.abs(dx) > Math.abs(dy)) {
      enemy.dir = dx > 0 ? 'right' : 'left';
    } else {
      enemy.dir = dy > 0 ? 'down' : 'up';
    }
  }

  // 移动
  let mx = 0, my = 0;
  switch (enemy.dir) {
    case 'up': my = -1; break;
    case 'down': my = 1; break;
    case 'left': mx = -1; break;
    case 'right': mx = 1; break;
  }

  const moved = enemy.move(mx, my, enemy.dir, mapData, enemies);
  if (!moved) {
    // 撞墙换方向
    const dirs = ['up', 'down', 'left', 'right'];
    enemy.dir = dirs[Math.floor(Math.random() * 4)];
    enemy.aiChangeDir = 20 + Math.floor(Math.random() * 30);
  }

  // 随机射击
  if (Math.random() < 0.015 && enemy.shootCooldown <= 0) {
    const bullet = enemy.shoot();
    if (bullet) bullets.push(bullet);
  }

  enemy.update();
}

// ==================== 碰撞检测（子弹） ====================
function checkBulletHits() {
  for (const bullet of bullets) {
    if (!bullet.alive) continue;
    const bb = bullet.getBounds();

    if (bullet.isPlayerBullet) {
      // 玩家子弹打敌人
      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        if (enemy.collidesWith(bb)) {
          bullet.alive = false;
          enemy.alive = false;
          explosions.push(new Explosion(enemy.x, enemy.y, 'big'));
          spawnParticles(enemy.x, enemy.y, enemy.color, 20);
          const baseScore = enemy.scoreValue || (100 + level * 10);

          // 连杀系统
          comboCount++;
          comboChainTime = 120; // 2秒内连续击杀算连杀
          let comboBonus = 0;
          if (comboCount >= 8) {
            comboBonus = Math.floor(baseScore * 1.5);
            floatingTexts.push(new FloatingText(enemy.x, enemy.y - 20, `💥 ${comboCount}连杀! +${baseScore + comboBonus}`, '#ff4444', 20));
          } else if (comboCount >= 5) {
            comboBonus = Math.floor(baseScore * 1.0);
            floatingTexts.push(new FloatingText(enemy.x, enemy.y - 20, `🔥 ${comboCount}连杀! +${baseScore + comboBonus}`, '#ff8800', 18));
          } else if (comboCount >= 3) {
            comboBonus = Math.floor(baseScore * 0.5);
            floatingTexts.push(new FloatingText(enemy.x, enemy.y - 20, `⚡ ${comboCount}连杀! +${baseScore + comboBonus}`, '#ffcc00', 16));
          } else {
            floatingTexts.push(new FloatingText(enemy.x, enemy.y - 20, `+${baseScore}`, '#ffffff', 14));
          }
          score += baseScore + comboBonus;

          // 击杀敌人概率掉落道具 (40%概率)
          if (Math.random() < 0.4) {
            const pType = randomPowerUpType();
            powerUps.push(new PowerUp(enemy.x, enemy.y, pType));
          }

          updateUI();
          break;
        }
      }
    } else {
      // 敌人子弹打玩家
      if (player && player.alive && player.collidesWith(bb)) {
        bullet.alive = false;
        if (hasBuff('shield')) {
          // 护盾吸收伤害
          removeBuff('shield');
          explosions.push(new Explosion(player.x, player.y, 'small'));
          spawnParticles(player.x, player.y, '#00ff88', 20);
        } else {
          playerHit();
        }
      }
    }
  }
}

function playerHit() {
  lives--;
  explosions.push(new Explosion(player.x, player.y, 'big'));
  spawnParticles(player.x, player.y, player.color, 30);
  updateUI();

  if (lives <= 0) {
    gameState = 'lose';
    showMessage('msgLose');
    document.getElementById('loseSub').textContent =
      `最终分数: ${score}  到达关卡: ${level}`;
  } else {
    // 重生
    const sp = findSpawnPoints();
    player.x = sp.px;
    player.y = sp.py;
    player.dir = 'up';
    player.alive = true;
    player.shootCooldown = 30; // 短暂无敌
  }
}

// ==================== 渲染 ====================
function drawGrid() {
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += TILE) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += TILE) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawWalls() {
  for (const w of walls) {
    const x = w.col * TILE;
    const y = w.row * TILE;

    if (w.type === 1) {
      // 砖墙
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);

      // 砖纹理
      ctx.strokeStyle = '#a0522d';
      ctx.lineWidth = 1;
      const hh = TILE / 3;
      for (let i = 1; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x, y + hh * i);
        ctx.lineTo(x + TILE, y + hh * i);
        ctx.stroke();
      }
      // 垂直线
      const offsets = i => i % 3 === 0 ? TILE / 2 : (i % 3) * TILE / 2;
      for (let i = 0; i < 6; i++) {
        const ox = i % 3 === 0 ? 0 : (i % 3) * (TILE / 2);
        const row = Math.floor(i / 3);
        ctx.beginPath();
        ctx.moveTo(x + ox, y + row * hh);
        ctx.lineTo(x + ox, y + (row + 1) * hh);
        ctx.stroke();
      }
    } else if (w.type === 2) {
      // 钢铁
      ctx.fillStyle = '#666';
      ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
      ctx.fillStyle = '#888';
      ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
      ctx.fillStyle = '#aaa';
      ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
    }
  }
}

function drawTank(tank) {
  if (!tank.alive) return;
  const { x, y, size, dir, color, isPlayer } = tank;
  const s = size / 2;
  const trackW = s * 0.3;
  const bodyW = s * 0.7;
  const barrelL = s * 0.9;
  const barrelW = 5;

  ctx.save();
  ctx.translate(x, y);

  let angle = 0;
  switch (dir) {
    case 'up': angle = -Math.PI / 2; break;
    case 'down': angle = Math.PI / 2; break;
    case 'left': angle = Math.PI; break;
    case 'right': angle = 0; break;
  }
  ctx.rotate(angle);

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(-s + 2, -s + 2, s * 2, s * 2);

  // 履带
  ctx.fillStyle = '#333';
  ctx.fillRect(-s, -s, trackW, s * 2);       // 左履带
  ctx.fillRect(s - trackW, -s, trackW, s * 2); // 右履带

  // 履带纹理
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  for (let i = -s + 4; i < s; i += 6) {
    ctx.beginPath();
    ctx.moveTo(-s, i);
    ctx.lineTo(-s + trackW, i);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s - trackW, i);
    ctx.lineTo(s, i);
    ctx.stroke();
  }

  // 车身
  const bodyGrad = ctx.createLinearGradient(0, 0, 0, s * 2);
  bodyGrad.addColorStop(0, color);
  bodyGrad.addColorStop(1, shadeColor(color, -30));
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(-bodyW / 2, -s + 1, bodyW, s * 2 - 2);

  // 车身细节
  ctx.strokeStyle = shadeColor(color, -20);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-bodyW / 2, -s + 1, bodyW, s * 2 - 2);

  // 炮塔（圆形）
  const turretGrad = ctx.createRadialGradient(0, 0, s * 0.2, 0, 0, s * 0.55);
  turretGrad.addColorStop(0, lightenColor(color, 20));
  turretGrad.addColorStop(1, shadeColor(color, 10));
  ctx.fillStyle = turretGrad;
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 炮管
  ctx.fillStyle = '#444';
  ctx.fillRect(-barrelW / 2, -barrelL, barrelW, barrelL);
  ctx.strokeStyle = '#222';
  ctx.strokeRect(-barrelW / 2, -barrelL, barrelW, barrelL);

  // 炮管高光
  ctx.fillStyle = '#666';
  ctx.fillRect(-barrelW / 4, -barrelL, barrelW / 2, barrelL);

  // 玩家标识（十字准星）
  if (isPlayer) {
    ctx.fillStyle = '#fff';
    ctx.font = `${s * 0.6}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✦', 0, 0);

    // 护盾视觉效果
    if (hasBuff('shield')) {
      const shieldPulse = 1 + 0.15 * Math.sin(Date.now() * 0.01);
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(Date.now() * 0.008);
      ctx.beginPath();
      ctx.arc(0, 0, s * 1.2 * shieldPulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 加速视觉效果 - 速度线
    if (hasBuff('speed') && (keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright']
        || keys['w'] || keys['s'] || keys['a'] || keys['d'])) {
      ctx.fillStyle = '#00bfff';
      ctx.globalAlpha = 0.3;
      for (let i = 0; i < 3; i++) {
        const trailY = -s - 5 - i * 8 + (Date.now() * 0.05 % 8);
        ctx.fillRect(-3, trailY, 6, 6);
      }
      ctx.globalAlpha = 1;
    }
  }

  ctx.restore();
}

function drawBullet(bullet) {
  if (!bullet.alive) return;

  // 穿透弹有特殊颜色
  const mainColor = bullet.isPierce ? '#6ef' : (bullet.isPlayerBullet ? '#ff0' : '#f66');
  const coreColor = bullet.isPierce ? '#4af' : (bullet.isPlayerBullet ? '#ff0' : '#f44');

  // 曳光效果
  const gradient = ctx.createRadialGradient(bullet.x, bullet.y, 0, bullet.x, bullet.y, bullet.isPierce ? 11 : 8);
  gradient.addColorStop(0, '#fff');
  gradient.addColorStop(0.3, mainColor);
  gradient.addColorStop(1, 'transparent');

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(bullet.x, bullet.y, bullet.isPierce ? 11 : 8, 0, Math.PI * 2);
  ctx.fill();

  // 弹头
  ctx.fillStyle = coreColor;
  ctx.beginPath();
  ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(bullet.x, bullet.y, bullet.size * 0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawExplosion(ex) {
  const progress = 1 - ex.life / ex.maxLife;
  const maxRadius = ex.type === 'big' ? 30 : ex.type === 'small' ? 18 : 8;

  // 外圈
  const r = maxRadius * progress;
  const alpha = 1 - progress;

  // 火球
  const grad = ctx.createRadialGradient(ex.x, ex.y, r * 0.2, ex.x, ex.y, r);
  grad.addColorStop(0, `rgba(255,255,200,${alpha})`);
  grad.addColorStop(0.3, `rgba(255,180,50,${alpha * 0.9})`);
  grad.addColorStop(0.6, `rgba(255,80,20,${alpha * 0.6})`);
  grad.addColorStop(1, `rgba(100,20,0,0)`);

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticle(p) {
  const alpha = p.life / p.maxLife;
  ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
  if (p.color.startsWith('#')) {
    // 转换hex颜色
    const hex = p.color;
    const rr = parseInt(hex.slice(1,3), 16);
    const gg = parseInt(hex.slice(3,5), 16);
    const bb = parseInt(hex.slice(5,7), 16);
    ctx.fillStyle = `rgba(${rr},${gg},${bb},${alpha})`;
  }
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
  ctx.fill();
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
  return `rgb(${R},${G},${B})`;
}

function lightenColor(color, percent) {
  return shadeColor(color, percent);
}

function render() {
  // 背景
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawWalls();

  // 道具
  for (const pu of powerUps) pu.draw(ctx);

  // 粒子
  for (const p of particles) drawParticle(p);

  // 子弹
  for (const b of bullets) drawBullet(b);

  // 敌人坦克
  for (const e of enemies) drawTank(e);

  // 玩家坦克
  if (player && player.alive) drawTank(player);

  // 爆炸
  for (const e of explosions) drawExplosion(e);

  // 浮动文字
  for (const ft of floatingTexts) ft.draw(ctx);
}

// ==================== UI ====================
function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;

  const livesDiv = document.getElementById('lives');
  let html = '';
  for (let i = 0; i < 3; i++) {
    html += `<div class="life-icon${i >= lives ? ' lost' : ''}"></div>`;
  }
  livesDiv.innerHTML = html;
}

function updateBuffUI() {
  const bar = document.getElementById('buffBar');
  if (!bar) return;

  if (activeBuffs.length === 0) {
    bar.innerHTML = '';
    return;
  }

  let html = '';
  for (const buff of activeBuffs) {
    const def = POWERUP_DEFS[buff.type];
    if (!def) continue;
    const ratio = buff.maxDuration > 0 ? buff.remaining / buff.maxDuration : 1;
    const isExpiring = buff.maxDuration > 0 && buff.remaining < 90 && buff.remaining > 0;
    const timerColor = def.color;
    html += `
      <div class="buff-item${isExpiring ? ' expiring' : ''}">
        <span class="buff-icon">${def.icon}</span>
        <span class="buff-label" style="color:${def.color}">${def.label}</span>
        ${buff.maxDuration > 0 ? `<span style="font-size:11px;color:#999">${(buff.remaining / 60).toFixed(1)}s</span>` : ''}
        <div class="buff-timer-bar" style="width:${ratio * 100}%;background:${timerColor}"></div>
      </div>`;
  }
  bar.innerHTML = html;
}

function showMessage(id) {
  document.getElementById('msgStart').classList.remove('show');
  document.getElementById('msgWin').classList.remove('show');
  document.getElementById('msgLose').classList.remove('show');
  document.getElementById(id).classList.add('show');
  document.getElementById('overlay').classList.add('active');
}

function hideMessages() {
  document.getElementById('msgStart').classList.remove('show');
  document.getElementById('msgWin').classList.remove('show');
  document.getElementById('msgLose').classList.remove('show');
  document.getElementById('overlay').classList.remove('active');
}

// ==================== 游戏循环 ====================
function update() {
  if (gameState !== 'playing') return;

  handleInput();
  player.update();

  // 更新敌人
  for (const enemy of enemies) {
    aiUpdate(enemy);
  }

  // 更新子弹
  for (const bullet of bullets) {
    if (bullet.alive) bullet.update(mapData);
  }

  // 清理
  bullets = bullets.filter(b => b.alive);
  enemies = enemies.filter(e => e.alive);

  // 碰撞检测
  checkBulletHits();

  // 更新效果
  for (const ex of explosions) ex.update();
  for (const p of particles) p.update();
  for (const pu of powerUps) pu.update();
  for (const ft of floatingTexts) ft.update();
  explosions = explosions.filter(e => e.alive);
  particles = particles.filter(p => p.alive);
  powerUps = powerUps.filter(p => p.alive);
  floatingTexts = floatingTexts.filter(ft => ft.alive);

  // 玩家拾取道具
  if (player && player.alive) {
    const pb = player.getBounds();
    for (const pu of powerUps) {
      if (!pu.alive) continue;
      const dx = player.x - pu.x;
      const dy = player.y - pu.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < player.size / 2 + pu.radius) {
        pu.collected = true;
        activateBuff(pu.type);
        // 拾取特效
        spawnParticles(pu.x, pu.y, pu.def.color, 15);
      }
    }
  }

  // 更新buff计时器
  for (const buff of activeBuffs) {
    if (buff.remaining > 0) {
      buff.remaining--;
    }
  }
  // 连杀计时器
  if (comboChainTime > 0) {
    comboChainTime--;
    if (comboChainTime === 0) comboCount = 0;
  }

  // 清理过期buff（duration==-1的护盾不会自动过期）
  activeBuffs = activeBuffs.filter(b => b.remaining !== 0);

  // 更新buff UI
  updateBuffUI();

  // 检查胜利
  if (enemies.length === 0) {
    gameState = 'win';
    document.getElementById('winSub').textContent =
      `第 ${level} 关完成！  分数: ${score}`;
    showMessage('msgWin');
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ==================== 游戏控制 ====================
function startGame() {
  score = 0;
  level = 1;
  lives = 3;
  hideMessages();
  initLevel();
  updateUI();
  gameState = 'playing';
}

function nextLevel() {
  level++;
  hideMessages();
  initLevel();
  updateUI();
  gameState = 'playing';
}

function restartGame() {
  hideMessages();
  startGame();
}

// ==================== 启动 ====================
updateUI();
initLevel();
render();
requestAnimationFrame(gameLoop);
</script>
